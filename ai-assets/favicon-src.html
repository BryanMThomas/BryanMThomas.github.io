<!doctype html><html><head><meta charset="utf-8"><style>
  html,body{margin:0;padding:0}
  .icon{
    width:512px;height:512px;box-sizing:border-box;
    display:flex;align-items:center;justify-content:center;
    background:radial-gradient(120% 120% at 30% 20%, #142740 0%, #0a1622 70%);
    border-radius:112px;
  }
  .mono{
    font-family:-apple-system,'Helvetica Neue',Arial,sans-serif;
    font-weight:800;font-size:248px;letter-spacing:-14px;
    line-height:1;display:flex;
  }
  .b{color:#3fd0e0}
  .t{color:#f6b352;margin-left:-4px}
</style></head>
<body>
  <div class="icon"><div class="mono"><span class="b">B</span><span class="t">T</span></div></div>
</body></html>
